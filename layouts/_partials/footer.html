<footer class="site-footer">
    <div class="site-footer__inner">
        <div class="site-footer__identity">
            <span>&copy; <time datetime="{{ now.Format "2006" }}">{{ now.Format "2006" }}</time> {{ .Site.Params.author }}</span>
            <nav class="site-footer__secondary" aria-label="Secondary navigation">
                <a href="{{ "/publications/" | relURL }}">Publications</a>
                <a href="{{ "/contacts/" | relURL }}">Contacts</a>
                {{- with .Site.Params.privacyPolicy }}
                <a href="{{ . | relURL }}">Privacy</a>
                {{- end }}
            </nav>
            <nav class="site-footer__social" aria-label="Social links">
                {{ partialCached "social.html" . }}
            </nav>
        </div>

        {{- with .Site.Params.footerQuote }}
        <p class="site-footer__quote">{{ . }}</p>
        {{- end }}

        <nav class="site-footer__primary" aria-label="Footer navigation">
            <a href="{{ "/about/" | relURL }}">About</a>
            <a href="{{ "/archive/" | relURL }}">Archive</a>
            {{- with .Site.Params.social.rss }}
            <a href="{{ . }}">RSS</a>
            {{- end }}
        </nav>
    </div>
</footer>
